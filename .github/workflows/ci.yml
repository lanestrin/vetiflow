name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each job sets up its tools and runs scripts/verify.ps1, the same Verify you
# run locally. New checks belong in verify.ps1, not here. CI never reuses
# earlier Verify evidence: it starts from a fresh checkout and runs every check.
# Actions are pinned to commit SHAs; Dependabot keeps them current.
jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Integration tests start PostgreSQL in Docker via Testcontainers;
      # the runner provides Docker.
      - name: Verify
        run: pwsh -NoProfile -File scripts/verify.ps1 -ServerOnly

      - name: Upload Verify logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-verify-logs
          path: .verify/logs
          include-hidden-files: true
          if-no-files-found: ignore

  client:
    name: Client lint, build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vetiflow.client/package-lock.json

      - name: Verify
        run: pwsh -NoProfile -File scripts/verify.ps1 -ClientOnly

      - name: Upload Verify logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: client-verify-logs
          path: .verify/logs
          include-hidden-files: true
          if-no-files-found: ignore
